name: Domain probe (temporary)
on:
  push:
    branches: [tmp-color-probe]
permissions:
  contents: write
jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe domain, caching, and service workers
        run: |
          exec > >(tee probe-results.txt) 2>&1
          D=sharihaleybookkeeping.com
          echo "### DNS"
          for h in $D www.$D; do echo "-- $h"; dig +short A $h; dig +short CNAME $h; done
          dig +short NS $D
          for u in "https://$D/" "https://www.$D/" "https://$D/?utm_source=gmb&utm_medium=organic" "https://$D/about-us/" "https://$D/our-services/" "https://$D/contact/" "https://$D/about/"; do
            echo; echo "### HEAD $u"
            curl -sS -o /dev/null -D - -L --max-redirs 5 "$u" | grep -iE "^(HTTP|location|server|cache-control|expires|age|etag|last-modified|x-vercel|x-github|x-cache|x-served-by|cf-cache|x-litespeed|x-powered-by|vary)"
          done
          echo; echo "### WHICH SITE IS SERVED AT /"
          curl -sSL "https://$D/" -o home.html
          grep -o "<title>[^<]*</title>" home.html
          grep -c "elementor" home.html | sed 's/^/elementor mentions: /'
          grep -o 'site.css?v=[0-9a-f]*' home.html | head -1
          echo; echo "### SERVICE WORKER REFERENCES (old site)"
          grep -oiE "serviceWorker[^;]{0,160}|navigator\.serviceWorker[^;]{0,160}|[a-z0-9/_.-]*sw\.js|wp\.serviceworker|pwa[a-z-]*" home.html | sort -u | head -20
          echo "### END"
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe-results.txt && git commit -m "Domain probe results" && git push
