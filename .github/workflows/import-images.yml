name: Import images

# Copies the existing images off the WordPress site, optimizes them,
# and commits them to assets/img/. Runs on the first push, or manually
# from the Actions tab. Must run before DNS moves off WordPress.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/import-images.sh
      - .github/workflows/import-images.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick webp

      - name: Download and optimize
        run: bash scripts/import-images.sh

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img favicon.ico
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "Import and optimize images from the WordPress site"
            git push
          fi
